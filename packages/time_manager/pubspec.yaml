name: time_manager
description: "A new Flutter project."
version: 0.0.1
homepage:

environment:
  sdk: '>=3.2.6 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  collection: ^1.16.0
  timezone: ^0.9.0
  rrule: ^0.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  plugin:
    platforms:
      android:
        package: com.dienvu.time_manager
        pluginClass: TimeManagerPlugin
      ios:
        pluginClass: TimeManagerPlugin
      linux:
        pluginClass: TimeManagerPlugin
      macos:
        pluginClass: TimeManagerPlugin
      windows:
        pluginClass: TimeManagerPluginCApi
      web:
        pluginClass: TimeManagerWeb
        fileName: time_manager_web.dart


