org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation. The Flutter SDK/plugin sources live in
# the pub cache on C:, while this project (and its redirected build dir) is on D:.
# Kotlin's relocatable incremental cache tries to compute a relative path between
# the two, which is impossible across different Windows drive roots and throws
# "this and base files have different roots" -> "Could not close incremental
# caches" -> "Daemon compilation failed". Turning incremental off avoids it.
kotlin.incremental=false
# Do not fail the build on Kotlin/Java JVM target mismatches (some plugins, e.g.
# flutter_timezone, still target JVM 1.8 for Kotlin while Java uses 11/17).
kotlin.jvm.target.validation.mode=warning
